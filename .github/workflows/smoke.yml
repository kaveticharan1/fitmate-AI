name: Launch test (emulator)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag whose FitMate.apk to test
        required: true

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Download APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${{ inputs.tag }}" -R "${{ github.repository }}" -p FitMate.apk
      - name: Install, launch and collect the log
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r FitMate.apk
            adb logcat -c
            adb shell monkey -p com.kaveticharan.fitmate -c android.intent.category.LAUNCHER 1
            sleep 25
            adb shell pidof com.kaveticharan.fitmate && echo "APP RUNNING" || echo "APP NOT RUNNING"
            adb exec-out screencap -p > screen.png
            adb logcat -d -b crash > crash.txt || true
            adb logcat -d '*:E' > errors.txt || true
            adb logcat -d -s ReactNativeJS:V AndroidRuntime:E > rn.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launch-logs
          path: |
            crash.txt
            errors.txt
            rn.txt
            screen.png
